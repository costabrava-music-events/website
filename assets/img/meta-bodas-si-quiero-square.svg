  <rect x="164" y="650" width="752" height="1" rx="0.5" fill="#FFFFFF" fill-opacity="0.10"/>
  <text x="184" y="698" fill="#F8FAFC" font-size="36" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="600" textLength="712" lengthAdjust="spacing">
    La m&#250;sica de vuestra boda no deber&#237;a
  </text>
  <text x="184" y="742" fill="#F8FAFC" font-size="36" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="600" textLength="712" lengthAdjust="spacing">
