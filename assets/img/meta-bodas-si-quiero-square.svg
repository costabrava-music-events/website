  </text>

  <rect x="184" y="930" width="712" height="84" rx="42" fill="url(#cta)"/>
  <text x="540" y="984" text-anchor="middle" fill="#FFFFFF" font-size="34" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800">
