  </text>

  <rect x="196" y="750" width="202" height="50" rx="25" fill="#22D3EE" fill-opacity="0.14" stroke="#67E8F9" stroke-opacity="0.42"/>
  <text x="297" y="783" text-anchor="middle" fill="#CFFAFE" font-size="23" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="700">
