      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="shadow" x="112" y="540" width="856" height="402" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="22"/>
      <feGaussianBlur stdDeviation="22"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.0117647 0 0 0 0 0.0470588 0 0 0 0 0.0901961 0 0 0 0.42 0"/>
    </filter>
    <filter id="blurA" x="-80" y="182" width="500" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <filter id="blurB" x="706" y="16" width="420" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="66"/>
    </filter>
  </defs>

  <image href="hero-beach-900.jpg" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1080" fill="url(#overlay)"/>

  <g filter="url(#blurA)">
    <circle cx="170" cy="432" r="106" fill="#22D3EE" fill-opacity="0.34"/>
  </g>
  <g filter="url(#blurB)">
    <circle cx="916" cy="226" r="84" fill="#FDBA74" fill-opacity="0.24"/>
  </g>

  <rect x="54" y="54" width="972" height="972" rx="42" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.16"/>

  <image href="logo-transparente.png" x="210" y="52" width="660" height="390" preserveAspectRatio="xMidYMid meet"/>

  <text x="92" y="450" fill="#FFFFFF" font-size="90" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" letter-spacing="-1.8">
