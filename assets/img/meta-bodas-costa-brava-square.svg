<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="overlay" x1="540" y1="0" x2="540" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071423" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#071423" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#04111E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="panel" x1="160" y1="512" x2="881" y2="952" gradientUnits="userSpaceOnUse">
