<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgOverlay" x1="540" y1="0" x2="540" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091321" stop-opacity="0.12"/>
      <stop offset="0.56" stop-color="#08111E" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#070D17" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="panel" x1="140" y1="614" x2="950" y2="954" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111B" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#0C1523" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="cardShadow" x="108" y="624" width="864" height="290" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="14"/>
      <feGaussianBlur stdDeviation="16"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.0196078 0 0 0 0 0.0470588 0 0 0 0 0.0941176 0 0 0 0.28 0"/>
    </filter>
  </defs>

  <image href="stock/pexels-dj-vinyl.jpg" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1080" fill="url(#bgOverlay)"/>
  <rect x="54" y="54" width="972" height="972" rx="42" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <image href="logo-transparente.png" x="110" y="-26" width="860" height="508" preserveAspectRatio="xMidYMid meet"/>

  <text x="540" y="484" text-anchor="middle" fill="#FFFFFF" font-size="78" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" letter-spacing="-1.6">
    Vuestra boda,
  </text>
  <text x="540" y="566" text-anchor="middle" fill="#FFFFFF" font-size="78" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" letter-spacing="-1.6">
    vuestro ritmo
  </text>

  <g filter="url(#cardShadow)">
    <rect x="140" y="654" width="800" height="250" rx="36" fill="url(#panel)" stroke="#E0F2FE" stroke-opacity="0.16"/>
  </g>
  <rect x="164" y="678" width="752" height="1" rx="0.5" fill="#FFFFFF" fill-opacity="0.10"/>
  <text x="184" y="726" fill="#F8FAFC" font-size="30" font-family="Helvetica Neue, Arial, sans-serif" font-weight="600" textLength="712" lengthAdjust="spacing">
    Cada boda tiene su energ&#237;a. Creamos una
  </text>
  <text x="184" y="766" fill="#F8FAFC" font-size="30" font-family="Helvetica Neue, Arial, sans-serif" font-weight="600" textLength="712" lengthAdjust="spacing">
    propuesta musical a medida para que todo
  </text>
  <text x="184" y="806" fill="#F8FAFC" font-size="30" font-family="Helvetica Neue, Arial, sans-serif" font-weight="600" textLength="712" lengthAdjust="spacing">
    encaje con vosotros, con vuestros invitados
  </text>
  <text x="184" y="846" fill="#F8FAFC" font-size="30" font-family="Helvetica Neue, Arial, sans-serif" font-weight="600">
    y con vuestro gran d&#237;a.
  </text>

  <rect x="184" y="930" width="712" height="84" rx="42" fill="url(#cta)"/>
  <text x="540" y="984" text-anchor="middle" fill="#FFFFFF" font-size="34" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700">
    RESERVA VUESTRA FECHA
  </text>
  <text x="540" y="1038" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.74" font-size="23" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700">
    www.costabravamusicevents.com
  </text>
</svg>
