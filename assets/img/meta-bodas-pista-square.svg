  </text>

  <rect x="196" y="780" width="186" height="46" rx="23" fill="#C084FC" fill-opacity="0.18" stroke="#D8B4FE" stroke-opacity="0.40"/>
  <text x="289" y="810" text-anchor="middle" fill="#F3E8FF" font-size="21" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="700">
    Lectura de pista
  </text>
  <rect x="400" y="780" width="164" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <text x="482" y="810" text-anchor="middle" fill="#F8FAFC" font-size="21" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="700">
