  </text>
  <text x="92" y="594" fill="#FFFFFF" font-size="82" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" letter-spacing="-1.4">
    la boda
  </text>

  <rect x="156" y="628" width="768" height="236" rx="36" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <text x="196" y="706" fill="#F1E8FF" font-size="35" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="600">
