<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="overlay" x1="540" y1="0" x2="540" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12071A" stop-opacity="0.26"/>
      <stop offset="0.54" stop-color="#160A22" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#090512" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="panel" x1="156" y1="566" x2="920" y2="926" gradientUnits="userSpaceOnUse">
      <stop stop-color="#100A1D" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#120A22" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <image href="meta-momento-crowd.png" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1080" fill="url(#overlay)"/>
  <rect x="54" y="54" width="972" height="972" rx="42" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <image href="logo-transparente.png" x="300" y="48" width="480" height="282" preserveAspectRatio="xMidYMid meet"/>

  <text x="92" y="430" fill="#FFFFFF" font-size="82" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" letter-spacing="-1.4">
    Una pista llena
  </text>
  <text x="92" y="512" fill="#FFFFFF" font-size="82" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" letter-spacing="-1.4">
