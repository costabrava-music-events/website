  </text>

  <rect x="156" y="906" width="768" height="84" rx="42" fill="url(#cta)"/>
  <text x="540" y="960" text-anchor="middle" fill="#FFFFFF" font-size="34" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" letter-spacing="0.5">
