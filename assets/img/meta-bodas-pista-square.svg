  </text>
  <rect x="582" y="780" width="150" height="46" rx="23" fill="#FB7185" fill-opacity="0.12" stroke="#FDA4AF" stroke-opacity="0.28"/>
  <text x="657" y="810" text-anchor="middle" fill="#FFE4E6" font-size="21" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="700">
