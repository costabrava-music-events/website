  </text>

  <text x="540" y="1026" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.74" font-size="23" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="700">
    www.costabravamusicevents.com
  </text>
