  </g>

  <image href="logo-transparente.png" x="190" y="170" width="700" height="700" preserveAspectRatio="xMidYMid meet"/>

  <g filter="url(#shadow)">
    <text x="540" y="1078" text-anchor="middle" fill="white" font-size="66" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="700" letter-spacing="1.2">
