<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="920" y2="1780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081A2D"/>
      <stop offset="0.56" stop-color="#0B2138"/>
      <stop offset="1" stop-color="#09131F"/>
    </linearGradient>
    <filter id="blurA" x="64" y="188" width="700" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
