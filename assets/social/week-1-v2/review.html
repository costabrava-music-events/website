<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Semana 1 v2</title>
    <style>
      body { margin: 0; background: #0b0d10; color: white; font-family: Arial, sans-serif; }
      main { max-width: 1180px; margin: 0 auto; padding: 32px 20px; }
      h1 { margin: 0 0 8px; font-size: 30px; }
      p { color: #c8ced8; }
      a { color: #f0d08a; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
      article { background: #161a20; border: 1px solid #2a3039; border-radius: 8px; overflow: hidden; }
      img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #050608; }
      .body { padding: 14px; }
      h2 { margin: 0 0 8px; font-size: 17px; }
      .meta { color: #f0d08a; font-size: 13px; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Instagram Semana 1 v2</h1>
      <p>Dirección realista premium con logo real. Post 1 publicado; posts 2, 3 y 4 programados.</p>
      <p><a href="../../../docs/social/instagram-week-1-v2-publishing-pack.md">Ver copies</a></p>
      <section class="grid">
        <article>
          <img src="post-01-wedding-terrace.png" alt="">
          <div class="body"><h2>Post 1 - Boda / DJ</h2><p class="meta">Post educativo</p></div>
        </article>
        <article>
          <img src="post-02-cocktail-live.png" alt="">
          <div class="body"><h2>Post 2 - Cóctel</h2><p class="meta">Post educativo</p></div>
        </article>
        <article>
          <img src="post-03-masia-night.png" alt="">
          <div class="body"><h2>Post 3 - Iluminación</h2><p class="meta">Post educativo</p></div>
        </article>
        <article>
          <img src="post-04-private-party.png" alt="">
          <div class="body"><h2>Post 4 - Fiesta privada</h2><p class="meta">Post educativo</p></div>
        </article>
      </section>
    </main>
  </body>
</html>
